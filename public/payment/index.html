<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pembayaran WiFi</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="panel" style="max-width:650px;margin:12vh auto"><div class="eyebrow">STATUS TRANSAKSI</div><h1 style="font-size:52px;letter-spacing:-3px">Pembayaran <span>WiFi</span></h1><div id="status">Memuat status...</div></div></main><script>
const ref=new URLSearchParams(location.search).get("ref"),el=document.getElementById("status"),FN="https://pbpqnhhsxhzvviykzhwk.supabase.co/functions/v1";
async function check(){if(!ref){el.textContent="Referensi transaksi tidak ada.";return}try{const r=await fetch(FN+"/payment-status?ref="+encodeURIComponent(ref));const j=await r.json();if(!j.success){el.textContent=j.message;return}const x=j.data;let h="<p>Status: <b>"+x.status+"</b></p>";if(x.status==="PAID"&&x.wifi){h+="<div class='ok'><b>Pembayaran berhasil.</b><br>Username: <b>"+x.wifi.username+"</b><br>Password: <b>"+x.wifi.password+"</b><br>Status WiFi: <b>"+x.wifi.status+"</b><br>Masa aktif sampai: "+new Date(x.wifi.expires_at).toLocaleString("id-ID")+"</div>"}else if(x.status==="PAID"){h+="<div class='ok'>Pembayaran sudah diterima. Sistem sedang mengaktifkan WiFi otomatis...</div>"}else{h+="<div class='qris-box'><b>PEMBAYARAN QRIS</b><p>Silakan selesaikan pembayaran melalui halaman QRIS.</p><small>Setelah pembayaran berhasil, halaman ini akan berubah otomatis.</small></div>"}el.innerHTML=h}catch(e){el.innerHTML="<div class='err'>Gagal mengambil status. Mencoba lagi...</div>"}}check();setInterval(check,4000);</script></body></html>
