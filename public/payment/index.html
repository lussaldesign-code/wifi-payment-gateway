<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pembayaran</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="panel" style="max-width:650px;margin:12vh auto"><div class="eyebrow">STATUS TRANSAKSI</div><h1 style="font-size:52px;letter-spacing:-3px">Pembayaran <span>WiFi</span></h1><div id="status">Memuat status...</div></div></main><script>
const ref=new URLSearchParams(location.search).get("ref");const el=document.getElementById("status");
async function check(){if(!ref){el.textContent="Referensi transaksi tidak ada.";return}const r=await fetch("/api/payment/"+encodeURIComponent(ref));const j=await r.json();if(!j.success){el.textContent=j.message;return}const x=j.data;el.innerHTML="<p>Status: <b>"+x.status+"</b></p>"+(x.checkout_url&&x.status!=="PAID"?'<p><a href="'+x.checkout_url+'" style="color:#93c5fd">Kembali ke pembayaran</a></p>':"")+(x.status==="PAID"?"<div class='ok'><b>Pembayaran berhasil.</b><br>Username: <b>"+x.username+"</b><br>Password: <b>"+x.password+"</b><br>Masa aktif sampai: "+new Date(x.expires_at).toLocaleString("id-ID")+"</div>":"<p>Menunggu konfirmasi payment gateway...</p>")}check();setInterval(check,5000);
</script></body></html>
