<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pembayaran</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="panel" style="max-width:650px;margin:12vh auto"><div class="eyebrow">STATUS TRANSAKSI</div><h1 style="font-size:52px;letter-spacing:-3px">Pembayaran <span>WiFi</span></h1><div id="status">Memuat status...</div></div></main><script>
const ref=new URLSearchParams(location.search).get("ref"),el=document.getElementById("status");
async function claim(){const r=await fetch("/api/payment/"+encodeURIComponent(ref)+"/claim",{method:"POST"});const j=await r.json();if(!j.success)alert(j.message||"Gagal");check()}
async function check(){if(!ref){el.textContent="Referensi transaksi tidak ada.";return}const r=await fetch("/api/payment/"+encodeURIComponent(ref));const j=await r.json();if(!j.success){el.textContent=j.message;return}const x=j.data;let h="<p>Status: <b>"+x.status+"</b></p>";if(x.status==="PAID")h+="<div class='ok'><b>Pembayaran berhasil.</b><br>Username: <b>"+x.username+"</b><br>Password: <b>"+x.password+"</b><br>Masa aktif sampai: "+new Date(x.expires_at).toLocaleString("id-ID")+"</div>";else{h+="<div class='qris-box'><b>SCAN QRIS</b><img src='/Qris.jpg' alt='QRIS Pembayaran'><small>Setelah membayar, tekan tombol konfirmasi. Aktivasi menunggu verifikasi.</small></div><button onclick='claim()'>SAYA SUDAH BAYAR</button><p style='color:#aab6cb'>Status akan diperbarui otomatis setelah pembayaran diverifikasi.</p>"}el.innerHTML=h}check();setInterval(check,5000);</script></body></html>
